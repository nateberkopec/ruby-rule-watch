[tools]
node = "26.10.0"
"npm:@devvit/cli" = "0.14.7"
hk = "2.4.0"
pkl = "0.32.1"
aube = "2.6.1"
gitleaks = "8.30.1"
"github:jdx/jactionlint" = "2.1.0"

[env]
_.file = ".env"

[tasks.test]
description = "Run the local system flow"
sources = ["src/**/*.ts", "tests/**/*.mjs", "package.json", "aube-lock.yaml"]
run = "npm run test:system"

[tasks.lint]
description = "Run all lint checks"
depends = ["lint:types", "lint:antislop", "lint:secrets", "lint:actions"]

[tasks."lint:types"]
description = "Check TypeScript"
sources = ["src/**/*.ts", "oxlint.config.ts", "tsconfig.json", "package.json", "aube-lock.yaml"]
run = "npm run check"

[tasks."lint:antislop"]
description = "Run Dillon Mulroy's anti-slop rules"
sources = ["src/**/*.ts", "tests/**/*.mjs", "tools/oxlint/anti-slop/**/*", "oxlint.config.ts", "package.json", "aube-lock.yaml"]
run = "npm run lint"

[tasks."lint:actions"]
description = "Check GitHub Actions workflows with jactionlint"
sources = [".github/**/*.yml"]
run = "jactionlint"

[tasks."lint:secrets"]
description = "Scan the working tree for plaintext secrets"
run = "gitleaks dir --redact=75 --no-banner --no-color --max-target-megabytes 5 ."

[tasks.build]
description = "Bundle the Devvit actor locally without uploading"
sources = ["src/**/*.ts", "tests/bundle.mjs", "devvit.json", "package.json", "aube-lock.yaml"]
outputs = ["dist/main.bundle.json"]
run = ["devvit-cli bundle actor", "node tests/bundle.mjs"]
